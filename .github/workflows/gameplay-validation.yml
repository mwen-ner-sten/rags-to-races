name: Full Gameplay Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

jobs:
  state-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:full
        env:
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gameplay-validation-${{ github.run_id }}
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
